name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=evidence_screening --cov-branch --cov-report=term-missing
      - run: python -m build
      - name: Documented dataset workflow
        run: |
          evidence-screening prepare --output artifacts
          evidence-screening search --query 'fault prediction' --output artifacts
          evidence-screening benchmark --seed 42 --target-recall 0.9 --output artifacts
          evidence-screening reviews --decisions artifacts/manual_review_template.csv --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.python }}
          path: |
            artifacts/benchmark.json
            artifacts/holdout_predictions.csv
            artifacts/search.json
            artifacts/reviews.json
